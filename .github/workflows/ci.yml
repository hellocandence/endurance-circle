name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # A real Postgres with pgvector, the same engine as production. The default database doubles as the e2e database.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cadence
          POSTGRES_PASSWORD: cadence
          POSTGRES_DB: cadence_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cadence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Dummy values: tests never talk to Google or send real email.
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      AUTH_URL: http://localhost:3000
      OWNER_EMAIL: owner@example.com
      TEST_DATABASE_URL: postgres://cadence:cadence@localhost:5432/postgres
      E2E_DATABASE_URL: postgres://cadence:cadence@localhost:5432/cadence_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm lint && pnpm typecheck

      - name: Unit tests (embedded Postgres)
        run: pnpm test

      - name: Unit tests (real Postgres 16 + pgvector)
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://cadence:cadence@localhost:5432/postgres

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests, including the AT-01 to AT-12 privacy suite (real Postgres)
        run: pnpm e2e

      - name: Production build, service worker and CSP tests
        run: pnpm e2e:pwa

      - name: Keep Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
