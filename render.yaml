# Render Blueprint for Cadence: one Node web service (UI + API). The database is Supabase Postgres (free plan never expires), set via DATABASE_URL.
# Deploy: Render dashboard > New > Blueprint > pick this repo. Then fill in the variables marked "sync: false".
# Steps, costs and the post-deploy checklist are in docs/03-ARCHITECTURE.md section 7.

services:
  - type: web
    name: cadence
    runtime: node
    region: singapore # closest Render region to India; change if your friends are elsewhere
    plan: free # sleeps after ~15 min idle. Use "starter" for always-on (a keep-alive ping of /api/health also works)
    buildCommand: pnpm install --frozen-lockfile && pnpm build && pnpm db:migrate && pnpm db:seed
    # Migrations and the owner seed are idempotent. They run at build time (free web services have no pre-deploy command)
    # so a cold start after sleep is just `next start` (~10s) and keep-alive pings never time out.
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass # deploy each new commit on main, but only after the GitHub Actions CI checks pass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL # Supabase Session pooler URI (port 5432) ending in ?sslmode=verify-full&sslrootcert=certs/supabase-ca.crt (verifies the server against the Supabase root CA committed in certs/; plain sslmode=require fails with a self-signed-cert error) Render has no IPv6, so not the direct host
        sync: false
      - key: AUTH_SECRET
        generateValue: true # random, stays the same across deploys
      - key: AUTH_URL # the public https URL, e.g. https://cadence.onrender.com. Set after the first deploy, then redeploy
        sync: false
      - key: OWNER_EMAIL # becomes the OWNER on first boot
        sync: false
      - key: GMAIL_CLIENT_ID # email goes through the Gmail API over HTTPS (Render free blocks SMTP ports). Required in production
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN # from `pnpm gmail:token`
        sync: false
      - key: EMAIL_FROM # e.g. Cadence <you@gmail.com>; Gmail sends as the account that granted the token
        sync: false
      - key: AUTH_GOOGLE_ID # optional until Google sign-in is set up (T083)
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
