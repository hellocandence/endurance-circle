# Render Blueprint for Cadence: one Node web service (UI + API). The database is Supabase Postgres (free plan never expires), set via DATABASE_URL.
# Deploy: Render dashboard > New > Blueprint > pick this repo. Then fill in the variables marked "sync: false".
# Steps, costs and the post-deploy checklist are in docs/03-ARCHITECTURE.md section 7.

services:
  - type: web
    name: cadence
    runtime: node
    region: singapore # closest Render region to India; change if your friends are elsewhere
    plan: free # sleeps after ~15 min idle. Use "starter" for always-on (a keep-alive ping of /api/health also works)
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    # Migrations and the owner seed are idempotent, so they run on every start. On a paid plan you can move
    # `pnpm db:migrate` to preDeployCommand instead (free web services do not support pre-deploy commands).
    startCommand: pnpm db:migrate && pnpm db:seed && pnpm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL # Supabase Session pooler URI (port 5432) ending in ?sslmode=require. Render has no IPv6, so not the direct host
        sync: false
      - key: AUTH_SECRET
        generateValue: true # random, stays the same across deploys
      - key: AUTH_URL # the public https URL, e.g. https://cadence.onrender.com. Set after the first deploy, then redeploy
        sync: false
      - key: OWNER_EMAIL # becomes the OWNER on first boot
        sync: false
      - key: BREVO_API_KEY # email (verification, password reset). Required in production (or RESEND_API_KEY)
        sync: false
      - key: EMAIL_FROM # e.g. Cadence <you@gmail.com>; must be a verified Brevo sender
        sync: false
      - key: AUTH_GOOGLE_ID # optional until Google sign-in is set up (T083)
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
